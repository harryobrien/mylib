services:
  mysql:
    image: mysql:8.0
    container_name: mylib-db
    environment:
      MYSQL_DATABASE: mylib
      MYSQL_USER: mylib
      MYSQL_PASSWORD: mylib
      MYSQL_ROOT_PASSWORD: mylib
    ports:
      - "3306:3306"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
      - mysqldata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mylib", "-pmylib"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: mylib-api
    environment:
      DATABASE_URL: mysql://mylib:mylib@mysql:3306/mylib
      INDEX_PATH: /data/index
      LISTEN_ADDR: 0.0.0.0:3000
      RUST_LOG: info
    expose:
      - "3000"
    volumes:
      - index_data:/data/index
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:3000
        PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
    container_name: mylib-web
    environment:
      API_URL: http://api:3000
    expose:
      - "4321"
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: mylib-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: mylib-phpmyadmin
    profiles: ["dev"]
    environment:
      PMA_HOST: mysql
      PMA_USER: mylib
      PMA_PASSWORD: mylib
    ports:
      - "5050:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:
  index_data:
